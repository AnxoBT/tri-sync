# Avisos y actualizaciones de dependencias (una PR al mes por tipo, agrupada).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]
    # Los saltos de versión mayor (Gradle 9, AGP 9…) piden cambiar la compilación: se hacen a mano.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]
