<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tri-Sync</title>
<link rel="icon" href="/logo.svg?v=2" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico?v=2" sizes="any">
<style>
  :root {
    --bg:#0f1317; --panel:#171d23; --panel2:#1d252c; --line:#28323c; --text:#e3e8ed; --muted:#8994a0;
    --acc:#3fb0ff; --ok:#2fbf71; --warn:#f0a020; --bad:#ef5350;
    --dx:#ff8000; --lb:#40bcf4; --sz:#00e054; --r:10px;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  a { color:var(--acc); text-decoration:none; } a:hover { text-decoration:underline; }
  button { font:inherit; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; background:var(--panel2); color:var(--text); border:1px solid var(--line); }
  button:hover:not(:disabled) { border-color:var(--acc); }
  button.pri { background:var(--acc); color:#04121c; border-color:var(--acc); font-weight:650; }
  button.danger { background:var(--ok); color:#04170c; border-color:var(--ok); font-weight:650; }
  button:disabled { opacity:.45; cursor:default; }
  input, select { font:inherit; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 16px; }

  header { background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header .wrap { display:flex; align-items:center; gap:20px; height:54px; }
  .logo { font-weight:750; letter-spacing:.2px; display:flex; align-items:center; gap:9px; }
  .logo img { width:26px; height:26px; }
  table.hist { width:100%; border-collapse:collapse; font-size:13px; } table.hist td, table.hist th { padding:8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  table.hist th { color:var(--muted); font-weight:500; } .delta { color:var(--acc); }
  .logo span { color:var(--muted); font-weight:500; }
  nav { display:flex; gap:4px; }
  nav button { background:none; border:0; color:var(--muted); padding:8px 12px; }
  nav button.on { color:var(--text); background:var(--panel2); }
  .hstat { margin-left:auto; color:var(--muted); font-size:12px; }

  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:18px 0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px; border-top:3px solid var(--line); }
  .card.dx { border-top-color:var(--dx); } .card.lb { border-top-color:var(--lb); } .card.sz { border-top-color:var(--sz); }
  .card h3 { margin:0 0 4px; font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  .card .v { font-size:15px; font-weight:600; } .card .s { color:var(--muted); font-size:12px; }

  .steps { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .step { display:flex; align-items:center; gap:8px; }
  .num { width:22px; height:22px; border-radius:50%; background:var(--panel2); border:1px solid var(--line); display:grid; place-items:center; font-size:12px; color:var(--muted); }
  .sep { color:var(--line); }
  #prog { margin-top:10px; color:var(--muted); font-size:13px; min-height:20px; }
  .bar { height:4px; background:var(--panel2); border-radius:4px; overflow:hidden; margin-top:6px; display:none; }
  .bar i { display:block; height:100%; width:30%; background:var(--acc); animation:mv 1.2s infinite ease-in-out; }
  @keyframes mv { 0% { margin-left:-30% } 100% { margin-left:100% } }

  .tools { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 8px; align-items:center; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:5px 10px; border-radius:20px; background:var(--panel); border:1px solid var(--line); cursor:pointer; font-size:13px; }
  .chip.on { border-color:var(--acc); color:var(--acc); }
  .chip b { margin-left:4px; }

  .group { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); margin:10px 0; overflow:hidden; }
  .ghead { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--panel2); cursor:pointer; }
  .group.fold .row { display:none; } .ghead .car { color:var(--muted); transition:transform .15s; } .group.fold .car { transform:rotate(-90deg); }
  .ghead .t { font-weight:650; } .ghead .n { color:var(--muted); }
  .ghead select { margin-left:auto; padding:5px 8px; font-size:13px; }
  .tag { font-size:11px; padding:2px 7px; border-radius:10px; border:1px solid var(--line); color:var(--muted); }
  .tag.Películas { color:var(--lb); border-color:var(--lb); } .tag.Series { color:var(--sz); border-color:var(--sz); }
  .row { display:grid; grid-template-columns:1fr auto; gap:6px 14px; padding:9px 12px; border-top:1px solid var(--line); align-items:center; }
  .row.sel { background:rgba(63,176,255,.06); }
  .row .t { font-weight:600; } .row .d { color:var(--muted); font-size:13px; } .row .l a { font-size:12px; margin-right:10px; }
  .seg { display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; }
  .seg label { font-size:12px; padding:5px 9px; border:1px solid var(--line); border-radius:7px; cursor:pointer; color:var(--muted); }
  .seg input { display:none; }
  .seg input:checked + span { color:var(--text); }
  .seg label:has(input:checked) { border-color:var(--acc); background:rgba(63,176,255,.12); color:var(--text); }
  .seg label.ign:has(input:checked) { border-color:var(--line); background:var(--panel2); }
  .empty { text-align:center; padding:50px 20px; color:var(--muted); background:var(--panel); border:1px dashed var(--line); border-radius:var(--r); margin-top:18px; }
  .empty b { display:block; color:var(--ok); font-size:18px; margin-bottom:6px; }

  .actionbar { position:sticky; bottom:0; background:var(--panel); border-top:1px solid var(--line); margin-top:20px; }
  .actionbar .wrap { display:flex; align-items:center; gap:10px; height:58px; }
  .actionbar .info { color:var(--muted); margin-right:auto; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; place-items:center; z-index:10; padding:16px; }
  .modal.on { display:grid; }
  .pbar { height:10px; background:var(--bg); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin:6px 0; }
  .pbar i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--dx), var(--sz), var(--lb)); transition:width .4s; }
  .ptxt { color:var(--muted); font-size:13px; margin-bottom:8px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); width:min(760px,100%); max-height:85vh; overflow:auto; padding:18px; }
  .box h2 { margin:0 0 10px; font-size:17px; }
  pre { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; color:var(--muted); font-size:12.5px; max-height:330px; overflow:auto; }
  .file { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px; margin:8px 0; }

  .cfg { display:grid; grid-template-columns:220px 1fr; gap:12px 16px; align-items:start; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px; margin-top:18px; }
  .cfg label { font-weight:600; padding-top:8px; } .cfg .h { color:var(--muted); font-size:12px; margin-top:4px; }
  .cfg input { width:100%; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .hidden { display:none !important; }
  @media (max-width:760px) { .cards { grid-template-columns:1fr; } .row { grid-template-columns:1fr; } .seg { justify-content:flex-start; } .cfg { grid-template-columns:1fr; } .hstat { display:none; } }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo"><img src="/logo.svg?v=2" alt="">Tri<span>-Sync</span></div>
  <nav><button id="tRev" class="on" onclick="vista('rev')">Revisión</button><button id="tHist" onclick="vista('hist')">Historial</button><button id="tCfg" onclick="vista('cfg')">Configuración</button></nav>
  <div class="hstat" id="hstat"></div>
</div></header>

<!-- ============ REVISIÓN ============ -->
<div id="vRev" class="wrap">
  <div class="cards">
    <div class="card dx"><h3>Dixmax</h3><div class="v">En directo (API)</div><div class="s">fechas del export: <span id="cDx">—</span></div></div>
    <div class="card lb"><h3>Letterboxd</h3><div class="v" id="cLb">—</div><div class="s">export más reciente</div></div>
    <div class="card sz"><h3>Serializd</h3><div class="v">En directo</div><div class="s">se lee al revisar</div></div>
  </div>

  <div class="steps">
    <div class="step"><span class="num">1</span>
      <button title="Solo de vez en cuando, para tener las fechas exactas" onclick="window.open('https://playmax.mx/settings.php?module=profile&mode=my_data')">Export Dixmax (opcional) ↗</button>
      <button onclick="window.open('https://letterboxd.com/settings/data/')">Export Letterboxd ↗</button></div>
    <span class="sep">›</span>
    <div class="step"><span class="num">2</span>
      <button class="pri" id="bRev" onclick="revisar('rapida')" title="~20 s: solo lo nuevo del diario de Serializd; episodios de Dixmax según el export">Revisión rápida</button>
      <button id="bRevC" onclick="revisar('completa')" title="~2 min: todo desde cero (detecta borrados y episodios nuevos de Dixmax por la API)">Completa</button></div>
    <div style="flex-basis:100%"><div id="prog"></div><div class="bar" id="bar"><i></i></div></div>
  </div>

  <div class="tools" id="tools">
    <input type="search" id="q" placeholder="Buscar título…" oninput="pintar()" style="min-width:220px">
    <div class="chips" id="chips"></div>
    <button onclick="plegarTodo(true)">Plegar todo</button><button onclick="plegarTodo(false)">Desplegar todo</button>
  </div>
  <div id="lista"></div>
</div>

<!-- ============ HISTORIAL ============ -->
<div id="vHist" class="wrap hidden" style="padding-top:16px"><div id="histT"></div></div>

<!-- ============ CONFIGURACIÓN ============ -->
<div id="vCfg" class="wrap hidden">
  <div class="cfg" id="cfgForm"></div>
  <div style="display:flex;gap:10px;margin:14px 0">
    <button class="pri" onclick="guardarCfg()">Guardar</button>
    <button onclick="probar()">Probar conexiones</button>
    <span id="cfgMsg" style="align-self:center"></span>
  </div>
  <div id="probar"></div>
</div>

<div class="actionbar" id="abar"><div class="wrap">
  <div class="info" id="selInfo">Nada seleccionado</div>
  <button onclick="todas('ignorar')">Limpiar selección</button>
  <button onclick="ejecutar(true)">Simular</button>
  <button class="danger" onclick="ejecutar(false)">Aplicar</button>
</div></div>

<div class="modal" id="modal"><div class="box">
  <h2 id="mT"></h2>
  <div id="mP" class="hidden"><div class="pbar"><i id="mPi"></i></div><div id="mPt" class="ptxt"></div></div>
  <div id="mF"></div><pre id="mL"></pre>
  <div style="text-align:right;margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
    <button id="bCancel" class="hidden" onclick="cancelar()">Cancelar</button>
    <button id="bCerrar" onclick="modal.classList.remove('on')">Cerrar</button></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA = {diferencias: []}, sel = {}, filtroCat = null, poll = null;

function vista(v) {
  for (const [k, id] of [['rev', 'Rev'], ['hist', 'Hist'], ['cfg', 'Cfg']]) {
    $('v' + id).classList.toggle('hidden', v !== k); $('t' + id).classList.toggle('on', v === k);
  }
  $('abar').classList.toggle('hidden', v !== 'rev');
  if (v === 'cfg') cargarCfg();
  if (v === 'hist') historial();
}

async function estado() {
  const e = await (await fetch('/api/estado')).json();
  const dx = e.exports.dixmax, lb = e.exports.letterboxd;
  $('cDx').textContent = dx.fecha ? `${dx.fecha} (${dx.edad})` : 'sin export';
  $('cLb').textContent = lb.fecha ? `${lb.fecha}` : 'sin export';
  $('cLb').title = lb.carpeta ? `${lb.carpeta} (${lb.edad})` : '';
  $('cLb').style.color = lb.horas > 24 ? 'var(--warn)' : '';
  $('hstat').textContent = e.calculado ? `Última revisión: ${e.calculado}` : 'Sin revisar todavía';
  return e;
}
async function cargarDiff() { DATA = await (await fetch('/api/diff')).json(); sel = {}; pintar(); }

const STAT_TXT = {dx_pelis_vistas: 'pelis vistas Dixmax', dx_pelis_pendientes: 'pelis pendientes Dixmax', dx_pelis_favoritas: 'pelis favoritas Dixmax',
  dx_series_terminadas: 'series terminadas', dx_series_siguiendo: 'series siguiendo', dx_series_pendientes: 'series pendientes',
  dx_series_favoritas: 'series favoritas', dx_episodios: 'episodios vistos', lb_vistas: 'vistas Letterboxd', lb_watchlist: 'watchlist Letterboxd',
  lb_me_gusta: 'me gusta Letterboxd', lb_diario: 'diario Letterboxd', sz_diario: 'diario Serializd', sz_vistas: 'series vistas Serializd', sz_favoritas: '♥ Serializd'};
async function historial() {
  const h = await (await fetch('/api/historial')).json();
  if (!h.length) { $('histT').innerHTML = '<div class="empty"><b>Sin revisiones todavía</b></div>'; return; }
  $('histT').innerHTML = `<table class="hist"><tr><th>Fecha</th><th>Modo</th><th>Duración</th><th>Diferencias</th><th>Cambios desde la anterior</th></tr>` +
    h.map((r, i) => {
      const prev = h[i + 1], s = r.stats || {};
      const deltas = prev ? Object.keys(STAT_TXT).filter(k => s[k] != null && prev.stats?.[k] != null && s[k] !== prev.stats[k])
        .map(k => `<span class="delta">${s[k] > prev.stats[k] ? '+' : ''}${s[k] - prev.stats[k]}</span> ${STAT_TXT[k]}`).join(' · ') : '';
      const cats = Object.entries(r.categorias || {}).map(([c, n]) => `${n} ${esc(c)}`).join('<br>');
      return `<tr><td>${esc(r.fecha)}</td><td>${esc(r.modo)}</td><td>${r.segundos} s</td><td>${r.diferencias ? cats : '✓ todo cuadra'}</td>
        <td>${deltas || (prev ? 'sin cambios' : '—')}</td></tr>`;
    }).join('') + '</table>';
}

async function revisar(modo) {
  $('bRev').disabled = $('bRevC').disabled = true; $('bar').style.display = 'block';
  await fetch('/api/revisar', {method: 'POST', body: JSON.stringify({modo})});
  poll = setInterval(async () => {
    const j = await (await fetch('/api/progreso')).json();
    $('prog').textContent = j.mensajes.slice(-1)[0] || 'Empezando…';
    if (!j.activo) {
      clearInterval(poll); $('bRev').disabled = $('bRevC').disabled = false; $('bar').style.display = 'none';
      if (j.error) { $('prog').innerHTML = `<span class="bad">Error: ${esc(j.error)}</span>`; return; }
      $('prog').innerHTML = `<span class="ok">Revisión terminada (${j.fin})</span>`;
      await estado(); await cargarDiff();
    }
  }, 900);
}

function pintar() {
  const q = $('q').value.toLowerCase();
  const all = DATA.diferencias || [];
  const cats = {};
  all.forEach(d => cats[d.categoria] = (cats[d.categoria] || 0) + 1);
  $('tools').classList.toggle('hidden', !all.length);
  $('chips').innerHTML = `<span class="chip ${!filtroCat ? 'on' : ''}" onclick="filtroCat=null;pintar()">Todas<b>${all.length}</b></span>` +
    Object.entries(cats).map(([c, n]) => `<span class="chip ${filtroCat === c ? 'on' : ''}" onclick='filtroCat=${JSON.stringify(c)};pintar()'>${esc(c)}<b>${n}</b></span>`).join('');
  const items = all.filter(d => (!filtroCat || d.categoria === filtroCat) && (!q || d.titulo.toLowerCase().includes(q)));
  if (!DATA.calculado && !all.length) { $('lista').innerHTML = `<div class="empty"><b>Aún no has revisado</b>Pulsa «Revisión rápida» (o «Completa» la primera vez).</div>`; return contar(); }
  if (!all.length) { $('lista').innerHTML = `<div class="empty"><b>✓ Todo cuadra</b>Dixmax, Letterboxd y Serializd están sincronizados.</div>`; return contar(); }
  const g = {};
  items.forEach(d => (g[d.seccion + '|' + d.categoria] ??= []).push(d));
  $('lista').innerHTML = Object.entries(g).map(([k, lst]) => {
    const [sec, cat] = k.split('|');
    const opts = {}; lst.forEach(d => d.opciones.forEach(o => opts[o.clave] = o.texto));
    const fold = plegado(k, lst.length);
    return `<div class="group ${fold ? 'fold' : ''}"><div class="ghead" onclick='plegar(event, ${JSON.stringify(k)})'>
        <span class="car">▾</span><span class="tag ${esc(sec)}">${esc(sec)}</span><span class="t">${esc(cat)}</span><span class="n">${lst.length}</span>
        <select onclick='event.stopPropagation()' onchange='grupo(${JSON.stringify(lst.map(d => d.id))}, this.value); this.value=""'>
          <option value="">Aplicar a todo el grupo…</option>
          ${Object.entries(opts).map(([c, t]) => `<option value="${c}">${esc(t)}</option>`).join('')}
        </select></div>
      ${lst.map(fila).join('')}</div>`;
  }).join('');
  contar();
}
// secciones plegables (se recuerda por navegador); las de más de 15 empiezan plegadas
let FOLD = {}; try { FOLD = JSON.parse(localStorage.getItem('plegados') || '{}'); } catch (e) {}
const plegado = (k, n) => FOLD[k] ?? n > 15;
function guardarFold() { try { localStorage.setItem('plegados', JSON.stringify(FOLD)); } catch (e) {} }
function plegar(ev, k) {
  const g = ev.currentTarget.parentElement; FOLD[k] = !g.classList.contains('fold');
  g.classList.toggle('fold', FOLD[k]); guardarFold();
}
function plegarTodo(v) {
  (DATA.diferencias || []).forEach(d => FOLD[d.seccion + '|' + d.categoria] = v); guardarFold(); pintar();
}
function fila(d) {
  const cur = sel[d.id] ?? 'ignorar';
  return `<div class="row ${cur !== 'ignorar' ? 'sel' : ''}" id="r_${d.id}"><div>
      <div class="t">${esc(d.titulo)}</div><div class="d">${esc(d.detalle)}</div>
      <div class="l">${Object.entries(d.enlaces || {}).filter(([, u]) => u).map(([k, u]) => `<a href="${esc(u)}" target="_blank">${esc(k)} ↗</a>`).join('')}</div>
    </div><div class="seg">${d.opciones.map(o => `<label class="${o.clave === 'ignorar' ? 'ign' : ''}">
      <input type="radio" name="${d.id}" value="${o.clave}" ${cur === o.clave ? 'checked' : ''} onchange="elegir('${d.id}', this.value)">
      <span>${esc(o.texto)}${o.fase === 3 ? ' (CSV)' : ''}</span></label>`).join('')}</div></div>`;
}
function elegir(id, v) { sel[id] = v; $('r_' + id).classList.toggle('sel', v !== 'ignorar'); contar(); }
function grupo(ids, v) { if (!v) return; ids.forEach(id => { const d = DATA.diferencias.find(x => x.id === id); if (d.opciones.some(o => o.clave === v)) sel[id] = v; }); pintar(); }
function todas(v) { (DATA.diferencias || []).forEach(d => sel[d.id] = v); pintar(); }
function elegidas() {
  return (DATA.diferencias || []).filter(d => (sel[d.id] ?? 'ignorar') !== 'ignorar')
    .map(d => ({id: d.id, categoria: d.categoria, titulo: d.titulo, accion: sel[d.id], datos: d.datos}));
}
function contar() { const n = elegidas().length; $('selInfo').textContent = n ? `${n} acciones seleccionadas` : 'Nada seleccionado'; }

let runPoll = null;
async function ejecutar(simulacion) {
  const acciones = elegidas();
  if (!acciones.length) return;
  if (!simulacion && !confirm(`¿Aplicar ${acciones.length} acciones de verdad?\n\nSerializd y Dixmax se cambian directamente; para Letterboxd se genera el CSV.`)) return;
  await fetch('/api/run', {method: 'POST', body: JSON.stringify({acciones, simulacion})});
  seguirRun();
}
function seguirRun() {
  $('mF').innerHTML = ''; $('mL').textContent = ''; $('modal').classList.add('on');
  $('mP').classList.remove('hidden'); $('mL').classList.add('hidden');
  $('bCancel').classList.remove('hidden'); $('bCancel').disabled = false; $('bCerrar').classList.add('hidden');
  clearInterval(runPoll);
  const paso = async () => {
    let r;
    try { r = await (await fetch('/api/run')).json(); } catch (e) { r = {error: 'sin conexión'}; }
    if (r.error || r.activo === undefined) {
      clearInterval(runPoll); $('mP').classList.add('hidden'); $('bCancel').classList.add('hidden'); $('bCerrar').classList.remove('hidden');
      $('mT').textContent = 'No puedo seguir el progreso';
      $('mF').innerHTML = '<p class="bad">Tri-Sync está desactualizado o cerrado: cierra la ventana negra y ábrelo de nuevo desde el acceso directo. Lo que se aplicó queda en la carpeta logs.</p>';
      return;
    }
    const pct = r.total ? Math.round(100 * Math.max(0, r.hechos - (r.activo ? 1 : 0)) / r.total) : 0;
    $('mT').textContent = (r.simulacion ? 'Simulando' : 'Aplicando') + (r.activo ? '…' : '');
    $('mPi').style.width = (r.activo ? pct : 100) + '%';
    $('mPt').textContent = r.activo ? `${Math.max(0, r.hechos - 1)} de ${r.total} · ${r.actual}` +
      (r.cancelar ? ' · cancelando (termina la acción en curso)…' : '') : '';
    if (!r.activo && r.resultado) { clearInterval(runPoll); fin(r); }
  };
  paso(); runPoll = setInterval(paso, 700);
}
function fin(r) {
  const res = r.resultado, simulacion = r.simulacion;
  $('mP').classList.add('hidden'); $('bCancel').classList.add('hidden'); $('bCerrar').classList.remove('hidden');
  $('mL').classList.toggle('hidden', !(res.log || []).length);
  const cancelado = (res.log || []).some(l => l.includes('CANCELADO'));
  $('mT').textContent = (simulacion ? 'Simulación' : cancelado ? 'Cancelado' : (res.ok ? 'Hecho' : 'Error')) + ` · ${r.total} acciones`;
  $('mL').textContent = (res.log || []).join('\n');
  $('mF').innerHTML = (res.archivos || []).map(f => `<div class="file">📄 ${esc(f.texto)}<br><small>${esc(f.archivo)}</small><br>
      <button onclick='abrir(${JSON.stringify(f.archivo)})'>Abrir carpeta</button> <a href="${esc(f.abrir)}" target="_blank">Abrir importador ↗</a></div>`).join('');
  if (!simulacion && res.ok) $('mF').innerHTML += `<p class="ok">Cuando termines, pulsa «Revisión rápida» para comprobar.</p>`;
}
async function cancelar() {
  if (!confirm('¿Cancelar? Se termina la acción en curso y no se hace nada más. Lo ya aplicado se queda (con sus fechas correctas).')) return;
  $('bCancel').disabled = true; await fetch('/api/cancelar', {method: 'POST'});
}
// si recargas o reabres la página mientras se aplica, vuelve a enseñar el progreso
fetch('/api/run').then(r => r.json()).then(r => { if (r.activo) seguirRun(); });
function abrir(archivo) { fetch('/api/abrir', {method: 'POST', body: JSON.stringify({archivo})}); }

// ---------- configuración ----------
const CAMPOS = [
  ['DATA_DIR', 'Carpetas de exports', 'Dónde buscar los zips o carpetas de Dixmax y Letterboxd. Varias separadas por ; · vacío = Descargas.'],
  ['LETTERBOXD_USER', 'Usuario de Letterboxd', ''],
  ['SERIALIZD_USER', 'Usuario de Serializd', ''],
  ['SERIALIZD_TOKEN', 'Token de Serializd', 'serializd.com → F12 → Application → Cookies → tvproject_credentials. Caduca de vez en cuando.', 1],
  ['DIXMAX_API_KEY', 'apiKey de Dixmax', 'playmax.mx/tusapps.php → Añadir App → copia la apiKey de tu app.', 1],
  ['DIXMAX_AUTH_KEY', 'authKey de Dixmax', 'Panel de Control → Aplicaciones autorizadas → autoriza tu app y copia la authKey.', 1],
];
async function cargarCfg() {
  const c = await (await fetch('/api/config')).json();
  $('cfgForm').innerHTML = CAMPOS.map(([k, t, h, sec]) => `<label for="f_${k}">${t}</label><div>
    <input id="f_${k}" ${sec ? 'type="password" autocomplete="off"' : ''} value="${sec ? '' : esc(c[k])}"
      placeholder="${sec ? (c[k].puesto ? '•••••• guardado (escribe para cambiarlo)' : 'no configurado') : ''}">
    ${h ? `<div class="h">${esc(h)}</div>` : ''}</div>`).join('');
}
async function guardarCfg() {
  const body = {}; CAMPOS.forEach(([k]) => body[k] = $('f_' + k).value);
  await fetch('/api/config', {method: 'POST', body: JSON.stringify(body)});
  $('cfgMsg').innerHTML = '<span class="ok">Guardado</span>'; cargarCfg(); estado();
}
async function probar() {
  $('probar').innerHTML = 'Probando…';
  const r = await (await fetch('/api/probar', {method: 'POST'})).json();
  $('probar').innerHTML = Object.entries(r).map(([k, v]) => `<p><b>${k}</b>: <span class="${!v.ok ? 'bad' : v.aviso ? 'warn' : 'ok'}">${esc(v.texto)}</span></p>`).join('');
}

estado().then(e => { if (e.trabajo && e.trabajo.activo) revisar(); });
cargarDiff();
